# Fly config for the JamMusicSpot web app (Dockerfile in this repo).
# Originally generated by `fly launch`; edited to document the choices below.
# Secrets (R2 keys, MONGO_URL) are NOT here — see `fly secrets set`.

app = 'jammusicspot'
primary_region = 'iad'

# Fly sends SIGTERM, the app drains in-flight commands and exits; if it hasn't
# by 8s it force-exits itself (src/server.js). kill_timeout must stay above 8s
# so Fly's SIGKILL never races the app's own exit.
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # Redis runs as a separate Fly app (deploy/fly.redis.toml). Not a secret: it
  # is only reachable inside this Fly organization. family=6 because the
  # private .internal DNS name resolves to IPv6 only and ioredis defaults to IPv4.
  REDIS_URL = 'redis://jammusicspot-redis.internal:6379?family=6'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'   # rooms are in-memory sockets; never sleep a machine
  auto_start_machines = true
  min_machines_running = 1     # `fly scale count 2` runs two to exercise multi-instance fan-out

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
